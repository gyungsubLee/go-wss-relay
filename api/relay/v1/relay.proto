syntax = "proto3";

package relay.v1;

option go_package = "github.com/gyungsubLee/go-wss-relay/gen/go/relay/v1;relayv1";
option csharp_namespace = "Relay.V1";

message Envelope {
  uint32 protocol_revision = 1;
  uint64 sequence = 2;
  bytes auth_tag = 3;
  string session_id = 4;
  string room_id = 5;

  oneof body {
    Hello hello = 10;
    Challenge challenge = 11;
    Auth auth = 12;
    Bound bound = 13;
    ClientData client_data = 14;
    ServerData server_data = 15;
    Ping ping = 16;
  }
}

message Hello {
  bytes grant_id = 1;
  bytes client_nonce = 2;
  bytes padding = 3;
}

message Challenge {
  bytes candidate_id = 1;
  bytes server_nonce = 2;
  int64 expires_unix_ms = 3;
}

message Auth {
  bytes candidate_id = 1;
}

message Bound {
  bytes binding_id = 1;
  int64 expires_unix_ms = 2;
}

message ClientData {
  bytes binding_id = 1;
  bytes payload = 2;
}

message ServerData {
  string sender_participant_id = 1;
  bytes payload = 2;
}

message Ping {
  bytes binding_id = 1;
}
