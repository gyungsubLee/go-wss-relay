name: CI

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Expose the toolchain at the repository tool path used by tests
        run: |
          mkdir -p .tools/go/bin
          ln -s "$(go env GOROOT)/bin/go" .tools/go/bin/go
      - name: gofmt
        run: test -z "$(gofmt -l cmd internal)"
      - run: go vet ./...
      - run: go test -race ./...
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...

  deployment-scripts:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Deployment and traffic safety checks
        run: |
          sh -n infrastructure/scripts/check-traffic-budget.sh
          bash -n infrastructure/scripts/check-deployment.sh infrastructure/scripts/deploy-backend.sh infrastructure/scripts/package-release.sh infrastructure/scripts/setup-host.sh
          python3 infrastructure/scripts/tests/traffic-budget.py
          python3 infrastructure/scripts/tests/deploy-backend.py
          python3 infrastructure/scripts/tests/operator-token.py
          python3 infrastructure/scripts/tests/setup-host.py

  web-client:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: true
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - run: npm ci --prefix client
      - run: npm run build --prefix client
      - name: Build protocol and process checks
        run: |
          mkdir -p out .cache
          go build -o out/wss-relay ./cmd/wss-relay
          go build -o out/wire-check ./cmd/wire-check
          go run ./cmd/dev-tls
          python3 - <<'PYTOKEN'
          import os, secrets
          fd = os.open('.cache/wss-demo.token', os.O_WRONLY | os.O_CREAT | os.O_EXCL, 0o600)
          with os.fdopen(fd, 'w') as target:
              target.write(secrets.token_urlsafe(32))
          PYTOKEN
      - name: Binary compatibility and distributed recovery
        run: |
          node --experimental-transform-types client/scripts/check-wire.ts
          NODE_EXTRA_CA_CERTS="$PWD/.cache/dev-tls/cert.pem" node --experimental-transform-types client/scripts/check-cluster.ts
      - name: SDK against the actual public API and WebSocket
        run: |
          out/wss-relay --operator-token-file .cache/wss-demo.token --public-url ws://127.0.0.1:8090/v2/relay > .cache/sdk-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          python3 - <<'PYREADY'
          import time, urllib.request
          for attempt in range(100):
              try:
                  urllib.request.urlopen('http://127.0.0.1:8090/healthz', timeout=1).close()
                  break
              except OSError:
                  time.sleep(.1)
          else:
              raise SystemExit('SDK server startup timed out')
          PYREADY
          node --experimental-transform-types client/scripts/check-sdk.ts
